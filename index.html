<header><div class="wrap top"><div class="brand"><svg width="38" height="38" viewBox="0 0 38 38"><rect width="38" height="38" rx="9" fill="#f2a541"/><path d="M5 30 L5 14 L16 14 L30 28 L30 30Z" fill="#1b2a41"/><path d="M8 20 Q18 30 28 27" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="3 2"/></svg><div><b>SlopeCheck</b><small>Penilaian Kestabilan Lereng · Inspeksi Lapangan Tingkat 1–7</small></div></div><button class="ghost" id="rst">Reset data</button></div></header>

`<label>${l}<span class="iw"><input data-k="${k}" data-t="${t}" type="${t=='n'?'number':t=='d'?'date':'text'}" ${t=='n'?'step="any" inputmode="decimal"':''} value="${S[k]??''}">${u?`<i>${u}</i>`:''}</span></label>`;

<section class="pane" id="p0"><div class="card"><h2>Mode Input</h2><p class="sub">Pilih sesuai data yang tersedia. Bisa diganti kapan saja; isian tetap tersimpan.</p><div class="mode"><label class="mc"><input type="radio" name="mode" data-mode="0"${S.mode==0?' checked':''}>Visual saja<small>Cukup pengamatan lapangan. Hanya Tingkat 1 yang dinilai.</small></label><label class="mc"><input type="radio" name="mode" data-mode="1"${S.mode==1?' checked':''}>Data lengkap<small>Tingkat 1–7: massa batuan, kinematik, kesetimbangan batas, probabilistik, numerik, pemantauan.</small></label></div></div><div class="card"><h2>Data Umum Inspeksi</h2><p class="sub">Identitas lereng yang diperiksa.</p><div class="f">${fld('perusahaan','Perusahaan / IUP','t')}${fld('lokasi','Lokasi / Blok','t')}${fld('idl','ID / Nama Lereng','t')}${fld('tgl','Tanggal Inspeksi','d')}${fld('insp','Inspektur','t')}${fld('jenis','Jenis Tambang','i','',OPT.jenis)}</div></div>${nv(0)}</section>
